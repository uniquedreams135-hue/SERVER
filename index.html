<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Credit Steaming Media</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
}
header {
    background: #1f1f1f;
    padding: 15px;
    text-align: center;
}
.category-bar {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
    flex-wrap: wrap;
}
.category-bar button {
    padding: 8px 16px;
    border: none;
    border-radius: 5px;
    background: #333;
    color: #fff;
    cursor: pointer;
    font-size: 18px; /* Ensures emoji renders clearly */
}
.category-bar button:hover {
    background: #e50914;
}
.container {
    display: none; /* Hidden since not used */
}
footer {
    background: #1f1f1f;
    padding: 10px;
    text-align: center;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="mainPage">
    <header>
        <h1>Credit Steaming Media</h1>
    </header>

    <div class="category-bar" id="categoryBar"></div>
    <div class="container" id="movieContainer"></div>

    <footer>All types of content – movies, web series, anime, leaks, etc.</footer>
</div>

<script>
const link = "https://uniquedreams135.blogspot.com/2026/01/blog-post.html?m=1";

const btn = document.createElement("button");
btn.innerText = "🔞";
btn.onclick = () => {
    const pass = prompt("Enter password for access:");
    if (pass === "vpass") {
        window.open(link, "_blank");
    } else {
        alert("Incorrect password! Please contact the website owner for access.");
    }
};

document.getElementById("categoryBar").appendChild(btn);
</script>

</body>
</html>
