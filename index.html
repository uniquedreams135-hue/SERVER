<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Credit Steaming Media</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
}
header {
    background: #1f1f1f;
    padding: 15px;
    text-align: center;
}
.category-bar {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
    flex-wrap: wrap;
}
.category-bar button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    cursor: pointer;
    font-size: 20px;
    transition: background 0.2s;
}
.category-bar button:hover {
    background: #e50914;
}
.container {
    display: none;
}
footer {
    background: #1f1f1f;
    padding: 10px;
    text-align: center;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="mainPage">
    <header>
        <h1>Credit Steaming Media</h1>
    </header>

    <div class="category-bar" id="categoryBar"></div>
    <div class="container" id="movieContainer"></div>

    <footer>All types of content – movies, web series, anime, leaks, etc.</footer>
</div>

<script>
// 🔞 Button - Original secret link
const adultBtn = document.createElement("button");
adultBtn.innerText = "🔞";
adultBtn.onclick = () => {
    const pass = prompt("Enter password for access:");
    if (pass === "maryana") {
        window.open("https://uniquedreams135.blogspot.com/2026/01/blog-post.html?m=1", "_blank");
    } else {
        alert("Incorrect password! Please contact the website owner for access.");
    }
};

// 🔥 Button - New leak link
const leakBtn = document.createElement("button");
leakBtn.innerText = "🔥";
leakBtn.onclick = () => {
    const pass = prompt("Enter password for leak section:");
    if (pass === "leak") {
        window.open("https://uniquedreams135.blogspot.com/2026/01/all-types-videos.html?m=1", "_blank");
    } else {
        alert("Incorrect password! This section is highly restricted.");
    }
};

// Add buttons to the category bar
document.getElementById("categoryBar").appendChild(adultBtn);
document.getElementById("categoryBar").appendChild(leakBtn);
</script>

</body>
</html>
