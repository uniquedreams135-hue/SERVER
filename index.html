<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Credit Steaming Media</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
}
header {
    background: #1f1f1f;
    padding: 15px;
    text-align: center;
}
header input {
    margin-top: 10px;
    padding: 8px;
    width: 60%;
    max-width: 400px;
    border: none;
    border-radius: 5px;
}
.category-bar {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
    flex-wrap: wrap;
}
.category-bar button {
    padding: 8px 16px;
    border: none;
    border-radius: 5px;
    background: #333;
    color: #fff;
    cursor: pointer;
}
.category-bar button.active,
.category-bar button:hover {
    background: #e50914;
}
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
    padding: 15px;}

/* Movie Card - RED COLOR */
.movie {
    position: relative;
    background: #e50914; /* ✅ RED BACKGROUND */
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(229, 9, 20, 0.5); /* Red shadow */
    transition: transform 0.2s ease, background 0.2s;
    padding: 10px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 80px;
    max-width: 180px;
    margin: 0 auto;
}
.movie:hover {
    transform: scale(1.05);
    background: #b20710; /* Darker red on hover */
}
.movie h3 {
    margin: 0;
    padding: 0;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

footer {
    background: #1f1f1f;
    padding: 10px;
    text-align: center;
    font-size: 14px;
}

/* 📱 MOBILE RESPONSIVE */
@media (min-width: 768px) {
    .container {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        padding: 20px;
    }
    .movie {        height: 100px;
        padding: 12px;
        max-width: 200px;
    }
    .movie h3 {
        font-size: 16px;
    }
}

@media (min-width: 1024px) {
    .container {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 25px;
        padding: 25px;
    }
    .movie {
        height: 120px;
        padding: 15px;
        max-width: 220px;
    }
    .movie h3 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<!-- MAIN PAGE -->
<div id="mainPage">
    <header>
        <h1>Credit Steaming Media</h1>
        <input type="text" id="search" placeholder="Search content...">
    </header>

    <div class="category-bar" id="categoryBar"></div>
    <div class="container" id="movieContainer"></div>

    <footer>All types of content – movies, web series, anime, leaks, etc.</footer>
</div>

<script>
// ================= CONTENT DATA =================
const movies = [
    {
        title: "NOWHERE",
        link: "https://uniquedreams135.blogspot.com/2026/01/blog-post.html?m=1", // ✅ Updated link
        category: "Action",
        description: "A woman fights for survival while stranded at sea — a gripping Netflix thriller."    }
];

// ================= SCRIPT =================
const mainPage = document.getElementById("mainPage");
const container = document.getElementById("movieContainer");
const search = document.getElementById("search");
const categoryBar = document.getElementById("categoryBar");

let currentCategory = "Action";
const categories = ["Action"];

categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.innerText = cat;
    btn.classList.add("active");

    btn.onclick = () => {
        const pass = prompt("Enter password for Action content:");
        if (pass !== "vpass") {
            alert("Incorrect password! Please contact the website owner for access.");
            return;
        }
        filterMovies();
    };

    categoryBar.appendChild(btn);
});

function filterMovies() {
    const val = search.value.toLowerCase();
    const list = movies.filter(m =>
        m.category === currentCategory &&
        m.title.toLowerCase().includes(val)
    );
    showMovies(list);
}

function showMovies(list) {
    container.innerHTML = "";
    if (list.length === 0) {
        container.innerHTML = "<p>No content found.</p>";
        return;
    }
    list.forEach(movie => {
        const div = document.createElement("div");
        div.className = "movie";
        div.innerHTML = `<h3>${movie.title}</h3>`;

        div.onclick = () => {            window.open(movie.link, "_blank");
        };

        container.appendChild(div);
    });
}

search.addEventListener("keyup", filterMovies);
</script>

</body>
</html>
