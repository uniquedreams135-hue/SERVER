<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Credit Steaming Media</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#121212;
    color:#fff;
}
header{
    background:#1f1f1f;
    padding:15px;
    text-align:center;
}
header input{
    margin-top:10px;
    padding:8px;
    width:60%;
    max-width:400px;
    border:none;
    border-radius:5px;
}
.category-bar{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:15px 0;
    flex-wrap:wrap;
}
.category-bar button{
    padding:8px 16px;
    border:none;
    border-radius:5px;
    background:#333;
    color:#fff;
    cursor:pointer;
}
.category-bar button.active,
.category-bar button:hover{
    background:#e50914;
}
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    padding:20px;}
.movie{
    position:relative;
    background:#1e1e1e;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
}
.movie img{
    width:100%;
    height:260px;
    object-fit:cover;
}
.movie h3{
    position:absolute;
    bottom:0;
    width:100%;
    margin:0;
    padding:8px 0;
    background:rgba(0,0,0,0.6);
    text-align:center;
}
footer{
    background:#1f1f1f;
    padding:10px;
    text-align:center;
    font-size:14px;
}

/* Description Page */
#descPage{
    display:none;
    padding:20px;
    text-align:center;
}
#descPage img{
    width:250px;
    height:350px;
    object-fit:cover;
    border-radius:8px;
}
#descPage p{
    max-width:600px;
    margin:15px auto;
}
#descPage video{
    width:90%;
    max-width:600px;
    margin:15px 0;
    border-radius:8px;}
#descPage button{
    padding:10px 18px;
    margin:8px;
    border:none;
    border-radius:5px;
    background:#e50914;
    color:#fff;
    cursor:pointer;
}
#backBtn{
    background:#555;
}
</style>
</head>

<body>

<!-- MAIN PAGE -->
<div id="mainPage">
<header>
    <h1>Credit Steaming Media</h1>
    <input type="text" id="search" placeholder="Search content...">
</header>

<div class="category-bar" id="categoryBar"></div>
<div class="container" id="movieContainer"></div>

<footer>All types of content – movies, web series, anime, leaks, etc.</footer>
</div>

<!-- DESCRIPTION PAGE -->
<div id="descPage">
    <img id="descImg">
    <h1 id="descTitle"></h1>
    <p id="descText"></p>
    <video id="descVideo" controls autoplay muted></video><br>
    <button id="fullscreenBtn">Fullscreen</button>
    <button id="downloadBtn">Download</button>
    <button id="backBtn">Back</button>
</div>

<script>
// ================= CONTENT DATA =================
const movies = [
    {
        title: "Action Movie 1",
        image: "https://drive.google.com/thumbnail?id=16lxU26CD8Qx5fvwgR3qVA_HZXv42rWor&sz=w1000",
        trailer: "https://drive.google.com/uc?export=download&id=16lxU26CD8Qx5fvwgR3qVA_HZXv42rWor",
        download: "https://drive.google.com/uc?export=download&id=16lxU26CD8Qx5fvwgR3qVA_HZXv42rWor",        category: "Action",
        description: "Exclusive action-packed content including movies, web series, and more."
    }
];

// ================= SCRIPT =================
const mainPage = document.getElementById("mainPage");
const descPage = document.getElementById("descPage");
const container = document.getElementById("movieContainer");
const search = document.getElementById("search");
const categoryBar = document.getElementById("categoryBar");

let currentCategory = "Action";
const categories = ["Action"];

categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.innerText = cat;
    btn.classList.add("active");

    btn.onclick = () => {
        const pass = prompt("Enter password for Action content:");
        if (pass !== "999897") {
            alert("Incorrect password! Please contact the website owner for access.");
            return;
        }
        filterMovies();
    };

    categoryBar.appendChild(btn);
});

function filterMovies(){
    const val = search.value.toLowerCase();
    const list = movies.filter(m =>
        m.category === currentCategory &&
        m.title.toLowerCase().includes(val)
    );
    showMovies(list);
}

function showMovies(list){
    container.innerHTML = "";
    if (list.length === 0) {
        container.innerHTML = "<p>No content found.</p>";
        return;
    }
    list.forEach(movie => {
        const div = document.createElement("div");
        div.className = "movie";        div.innerHTML = `<img src="${movie.image}" onerror="this.src='https://via.placeholder.com/180x260?text=Video'"><h3>${movie.title}</h3>`;
        div.onclick = () => showDescription(movie);
        container.appendChild(div);
    });
}

function showDescription(movie){
    mainPage.style.display = "none";
    descPage.style.display = "block";

    document.getElementById("descImg").src = movie.image;
    document.getElementById("descTitle").innerText = movie.title;
    document.getElementById("descText").innerText = movie.description;

    const video = document.getElementById("descVideo");
    video.src = movie.trailer;
    video.load(); // Important!
    video.play().catch(e => {
        // Autoplay may be blocked; user must click play
        console.log("Autoplay not allowed. User interaction required.");
    });

    document.getElementById("downloadBtn").onclick = () => {
        window.open(movie.download, "_blank");
    };

    document.getElementById("fullscreenBtn").onclick = () => {
        if (video.requestFullscreen) video.requestFullscreen();
        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        else if (video.msRequestFullscreen) video.msRequestFullscreen();
    };
}

document.getElementById("backBtn").onclick = () => {
    const video = document.getElementById("descVideo");
    video.pause();
    video.currentTime = 0;
    descPage.style.display = "none";
    mainPage.style.display = "block";
};

search.addEventListener("keyup", filterMovies);
</script>

</body>
</html>
